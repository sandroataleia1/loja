[package]
name = "pdv-fashion"
version = "0.1.0"
description = "PDV Fashion — Desktop POS offline-first"
authors = []
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pdv_fashion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pdv-fashion"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri    = { version = "2", features = [] }
serde    = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid     = { version = "1",  features = ["v4"] }
chrono   = { version = "0.4", features = ["serde"] }
anyhow   = "1"
