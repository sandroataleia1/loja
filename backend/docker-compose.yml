services:

  # ─────────────────────────────────────────────────────
  # PHP 8.4-FPM — aplicação principal
  # ─────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: store_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - store_network
    environment:
      APP_ENV: ${APP_ENV:-local}

  # ─────────────────────────────────────────────────────
  # Horizon — processo supervisor de filas
  # ─────────────────────────────────────────────────────
  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: store_horizon
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan horizon
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - app
      - redis
    networks:
      - store_network

  # ─────────────────────────────────────────────────────
  # Nginx — proxy reverso
  # ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: store_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - store_network

  # ─────────────────────────────────────────────────────
  # PostgreSQL 16 — banco principal + banco de testes
  # ─────────────────────────────────────────────────────
  pgsql:
    image: postgres:16-alpine
    container_name: store_pgsql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-store}
      POSTGRES_USER: ${DB_USERNAME:-store}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - store_pgsql_data:/var/lib/postgresql/data
      - ./docker/pgsql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-store}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - store_network

  # ─────────────────────────────────────────────────────
  # Redis 7 — cache, sessões e filas
  # ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: store_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - store_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - store_network

  # ─────────────────────────────────────────────────────
  # Mailpit — SMTP de desenvolvimento
  # ─────────────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: store_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "${MAILPIT_PORT:-8025}:8025"
    networks:
      - store_network

networks:
  store_network:
    driver: bridge

volumes:
  store_pgsql_data:
  store_redis_data:
