# Admin (Next.js) em container.
# Publica em 0.0.0.0:3001 (Caddy/Nginx externo expõe em 443).
#
# Uso (rodar dentro de frontend/):
#   docker compose up -d --build
#
# Obs.: NEXT_PUBLIC_* é embutido no BUILD. Ao trocar a URL da API, rebuild.

services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Store Admin}
    container_name: store_admin
    restart: always
    ports:
      - "0.0.0.0:3001:3000"
